<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Component preview</title>
    <style>
      /* Same base reset that generated components had inside the app (Tailwind v4 preflight essentials). */
      *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
      html, body { height: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        background: #ffffff;
        color: #18181b;
      }
      html.dark body { background: #09090b; color: #fafafa; }
      h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
      a { color: inherit; text-decoration: inherit; }
      ol, ul, menu { list-style: none; }
      img, svg, video, canvas { display: block; max-width: 100%; }
      button, input, select, textarea { font: inherit; color: inherit; background-color: transparent; }
      button { cursor: pointer; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/preview-runtime.js"></script>
  </body>
</html>
